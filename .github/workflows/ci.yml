name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  seo-head-test:
    name: SEO SSR Head Content Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run SEO head-content test
        run: bun run test:seo
        env:
          BASE_URL: https://banglaev.com
