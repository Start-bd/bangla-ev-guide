name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  seo-head-test:
    name: SEO SSR Head Content Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run SEO head-content test
        run: bun run test:seo
        env:
          BASE_URL: https://banglaev.com

  ssr-byd-loader-check:
    name: SSR /byd loader failure check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run /byd SSR loader check
        id: ssr_check
        run: bun run test:ssr-byd
        env:
          PORT: "5273"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload SSR log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssr-byd-logs
          path: logs/ssr-byd.jsonl
          if-no-files-found: warn
          retention-days: 14

  playwright-featured-images:
    name: Playwright — featured model images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (Python) with Chromium
        run: |
          python -m pip install --no-cache-dir "playwright==1.47.0"
          python -m playwright install --with-deps chromium

      - name: Start dev server
        env:
          PORT: "8080"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          nohup bun run dev > dev-server.log 2>&1 &
          echo "DEV_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for dev server to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:8080/ >/dev/null; then
              echo "Dev server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Dev server never became ready" >&2
          tail -n 200 dev-server.log || true
          exit 1

      - name: Run featured-image Playwright check
        env:
          BASE_URL: http://localhost:8080
        run: python scripts/check-featured-images.py

      - name: Stop dev server
        if: always()
        run: |
          if [ -n "${DEV_PID:-}" ]; then kill "$DEV_PID" || true; fi

      - name: Upload dev server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log
          path: dev-server.log
          if-no-files-found: warn
          retention-days: 7
