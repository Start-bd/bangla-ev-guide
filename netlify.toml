[build]
  command = "bun install --frozen-lockfile && bun run build"
  # Nitro auto-detects its `netlify` preset when NETLIFY=true, which emits static
  # assets to `dist/` and the SSR handler to `.netlify/functions-internal/server/`.
  # Publishing `dist/client` instead fails because that layout is not emitted here.
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
