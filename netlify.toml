[build]
  command = "bun run build"
  # Nitro auto-detects its `netlify` preset when NETLIFY=true, which emits static
  # assets to `dist/` (preset publicDir is `dist/{{ baseURL }}`) and the SSR handler
  # to `.netlify/functions-internal/server/`. Publishing `dist/client` instead fails
  # with "Deploy directory 'dist/client' does not exist" — that layout only exists in
  # Lovable's sandbox, where the vite config overrides nitro's output dirs.
  publish = "dist"

[build.environment]
  # Pinned to the version the build has actually been verified on.
  NODE_VERSION = "22"
